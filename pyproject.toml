[project]
name = "solve_or_problem"
version = "0.1.0"
description = "solve-or-problem using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=0.130.0,<1.0.0",
    "ortools>=9.12.4544",
]

[project.scripts]
kickoff = "solve_or_problem.main:kickoff"
run_crew = "solve_or_problem.main:kickoff"
plot = "solve_or_problem.main:plot"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
